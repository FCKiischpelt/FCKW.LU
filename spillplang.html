<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      position: relative;
    }

    /* --- VOLLBILD DIAGONAL OVERLAY --- */
    .diagonal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .diagonal-overlay::before {
      content: "";
      position: absolute;
      width: 150%;
      height: 120px;
      background-color: #d32f2f;
      transform: rotate(-35deg);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .diagonal-text {
      position: absolute;
      color: #ffffff;
      font-size: 4.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      white-space: nowrap;
      transform: rotate(-35deg);
      text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.6);
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    @media (max-width: 768px) {
      .diagonal-overlay::before {
        height: 70px;
      }
      .diagonal-text {
        font-size: 1.8rem;
        letter-spacing: 2px;
      }
    }

    .navbar {
      width: 100%;
      background-color: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      box-sizing: border-box;
      flex-wrap: wrap;
      position: relative;
      z-index: 1000;
    }

    .nav-logo {
      height: 40px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: center;
      justify-content: flex-end;
      flex-grow: 1;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 1rem;
      transition: color 0.3s;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: #ccc;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: white;
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        margin-top: 1rem;
      }

      .nav-links.active {
        display: flex;
      }

      .hamburger {
        display: flex;
      }
    }

    .container {
      padding: 2rem;
      max-width: 1000px;
      margin: auto;
    }

    /* --- KOPFZEILE MIT LOGOS UND ÜBERSCHRIFT --- */
    .header-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .header-banner h1 {
      margin: 0;
      font-size: 2.2rem;
      text-align: center;
      text-transform: uppercase;
      color: #fff;
    }

    .header-logo {
      height: 70px;
      width: auto;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .header-banner {
        flex-direction: column;
        gap: 0.8rem;
      }

      .header-banner h1 {
        font-size: 1.5rem;
      }

      .header-logo {
        height: 55px;
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      color: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #000;
      padding: 1rem;
      text-align: left;
      font-size: 1rem;
    }

    th {
      background-color: #333;
      color: #fff;
      text-transform: uppercase;
    }

    /* Responsive Tabelle */
    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 1.5rem;
        background-color: #fff;
        color: #000;
        padding: 1rem;
        border-radius: 8px;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
      }

      td {
        border: none;
        padding: 0.5rem 0;
      }

      td::before {
        display: block;
        font-weight: bold;
        margin-bottom: 0.3rem;
        color: #555;
      }

      td:nth-child(1)::before { content: "Datum:"; }
      td:nth-child(2)::before { content: "Uhrzeit:"; }
      td:nth-child(3)::before { content: "Spieltag:"; }
      td:nth-child(4)::before { content: "Match:"; }
      td:nth-child(5)::before { content: "Terrain:"; }
    }
  </style>
