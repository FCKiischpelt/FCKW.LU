<!DOCTYPE html>
<html lang="lb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sponsoren – FC KIISCHPELT WËLWERWOLZ</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navigation Styles */
    .navbar {
      width: 100%;
      background-color: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      box-sizing: border-box;
      flex-wrap: wrap;
      position: relative;
      z-index: 1000;
    }

    .nav-logo {
      height: 40px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: center;
      justify-content: flex-end;
      flex-grow: 1;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 1rem;
      transition: color 0.3s;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: #ccc;
    }

    /* Mobile Optimierung */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: white;
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        margin-top: 1rem;
      }
      .nav-links.active {
        display: flex;
      }
      .hamburger {
        display: flex;
      }
    }

    /* Sponsoren Section */
    .sponsoren-section {
      padding: 2rem;
      text-align: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 2rem;
      margin-top: 2rem;
      margin-bottom: 1.5rem;
      color: #ffd700; /* Gold für Platin */
      border-bottom: 2px solid #ffd700;
      display: inline-block;
      padding-bottom: 5px;
    }

    .logo-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .logo-box {
      width: 180px;
      height: 120px;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-radius: 5px;
    }

    .logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="/">
      <img src="logo.png" alt="FC Kiischpelt Logo" class="nav-logo" />
    </a>
    <div class="hamburger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/dauerkaart">Dauerkaart</a>
      <a href="https://fckw.lu/veräin">Veräin</a>
      <a href="https://fckw.lu/spillplang">Spillplang</a>
      <a href="/sponsoren">Sponsoren</a>
      <a href="/socialmedia">Social Media</a>
    </div>
  </nav>

  <!-- Sponsoren Section -->
  <div class="sponsoren-section">
    <div class="section-title">PLATIN</div>
    <div class="logo-container">
      <div class="logo-box"><img src="https://github.com/user-attachments/assets/0590e541-c451-4443-b30e-39a527aee4b4" alt="MGC"></div>
      <div class="logo-box"><img src="https://github.com/user-attachments/assets/7a0aa2ef-a32c-4a5b-878b-81217702c234" alt="Kiischpelter Duerfbeier"></div>
      <div class="logo-box"><img src="https://github.com/user-attachments/assets/b9fa1882-c477-40e5-a8a4-aeb6f9b5e632" alt="ImmoPartner"></div>
      <div class="logo-box"><img src="https://github.com/user-attachments/assets/4268b696-1994-4780-ac0e-d4f0cf8a9ea9" alt="Biesen"></div>
      <div class="logo-box"><img src="https://github.com/user-attachments/assets/1e2d80f0-fbe4-4bca-bb30-d6a50c06250b" alt="Schilling"></div>
    </div>
  </div>

<script>
  function toggleMenu() {
    const nav = document.getElementById('navLinks');
    nav.classList.toggle('active');
  }
</script>

</body>
</html>
